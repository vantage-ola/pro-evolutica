[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-evolutica"
version = "0.1.0"
description = "Read-only executable and asset diagnostics for local game research"
requires-python = ">=3.11"
dependencies = ["pefile==2024.8.26"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
